name: Publish images and Helm charts

# Build production images in parallel, package Helm charts, and upload both
# as GitHub Actions artifacts. On main/develop, also bump chart versions.
# Image tags are derived from GITHUB_SHA in each job so a stuck metadata
# runner cannot block the four image builds.
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: publish-k8s-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-backend:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Precompile Alpine grpcio wheels
        run: docker build -f docker/Dockerfile.api.alpine-wheels -t keep-api-alpine-wheels:py313 .
      - name: Build Keep API
        run: |
          docker build -f docker/Dockerfile.api \
            --build-arg ALPINE_WHEELS_IMAGE=keep-api-alpine-wheels:py313 \
            -t "keep-backend:${IMAGE_TAG}" \
            -t keep-backend:latest .
      - name: Save backend image
        run: |
          mkdir -p dist/ci-artifacts/images
          docker save "keep-backend:${IMAGE_TAG}" \
            | gzip -1 > "dist/ci-artifacts/images/keep-backend__${IMAGE_TAG}.tar.gz"
      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: opsengine-image-keep-backend-${{ env.IMAGE_TAG }}
          path: dist/ci-artifacts/images/
          if-no-files-found: error
          retention-days: 14

  build-frontend:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build Keep UI
        run: |
          docker build -f docker/Dockerfile.ui \
            --build-arg NODE_MAX_OLD_SPACE_SIZE=8192 \
            --build-arg NPM_CI=0 \
            --build-arg IGNORE_TS_ERRORS=1 \
            -t "keep-frontend:${IMAGE_TAG}" \
            -t keep-frontend:latest \
            keep-ui
      - name: Save frontend image
        run: |
          mkdir -p dist/ci-artifacts/images
          docker save "keep-frontend:${IMAGE_TAG}" \
            | gzip -1 > "dist/ci-artifacts/images/keep-frontend__${IMAGE_TAG}.tar.gz"
      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: opsengine-image-keep-frontend-${{ env.IMAGE_TAG }}
          path: dist/ci-artifacts/images/
          if-no-files-found: error
          retention-days: 14

  build-temporal-worker:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build temporal-worker
        run: |
          docker build -f backend/services/temporal-worker/Dockerfile \
            -t "keep-temporal-worker:${IMAGE_TAG}" \
            -t keep-temporal-worker:latest \
            backend/services/temporal-worker
      - name: Save worker image
        run: |
          mkdir -p dist/ci-artifacts/images
          docker save "keep-temporal-worker:${IMAGE_TAG}" \
            | gzip -1 > "dist/ci-artifacts/images/keep-temporal-worker__${IMAGE_TAG}.tar.gz"
      - name: Upload worker image
        uses: actions/upload-artifact@v4
        with:
          name: opsengine-image-keep-temporal-worker-${{ env.IMAGE_TAG }}
          path: dist/ci-artifacts/images/
          if-no-files-found: error
          retention-days: 14

  build-provider-mock:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build provider-mock
        run: |
          docker build -f backend/services/provider-mock/Dockerfile \
            -t "keep-provider-mock:${IMAGE_TAG}" \
            -t keep-provider-mock:latest \
            backend/services/provider-mock
      - name: Save mock image
        run: |
          mkdir -p dist/ci-artifacts/images
          docker save "keep-provider-mock:${IMAGE_TAG}" \
            | gzip -1 > "dist/ci-artifacts/images/keep-provider-mock__${IMAGE_TAG}.tar.gz"
      - name: Upload mock image
        uses: actions/upload-artifact@v4
        with:
          name: opsengine-image-keep-provider-mock-${{ env.IMAGE_TAG }}
          path: dist/ci-artifacts/images/
          if-no-files-found: error
          retention-days: 14

  publish-artifacts:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    needs:
      - build-backend
      - build-frontend
      - build-temporal-worker
      - build-provider-mock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set image tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opsengine-image-*-${{ env.IMAGE_TAG }}
          path: dist/ci-artifacts/images
          merge-multiple: true

      - name: Bump Helm chart versions and prod image tags
        run: |
          chmod +x scripts/bump_helm_charts.sh
          IMAGE_REGISTRY="" \
          IMAGE_TAG="${IMAGE_TAG}" \
            ./scripts/bump_helm_charts.sh

      - name: Package Helm charts
        run: |
          chmod +x scripts/package_ci_artifacts.sh
          IMAGE_TAG="${IMAGE_TAG}" \
          SAVE_IMAGES=0 \
          GITHUB_SHA="${GITHUB_SHA}" \
            ./scripts/package_ci_artifacts.sh

      - name: Upload Docker image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opsengine-docker-images-${{ env.IMAGE_TAG }}
          path: dist/ci-artifacts/images/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Helm chart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opsengine-helm-charts-${{ env.IMAGE_TAG }}
          path: |
            dist/ci-artifacts/charts/
            dist/ci-artifacts/manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        run: |
          {
            echo "## CI artifacts"
            echo ""
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Combined images: \`opsengine-docker-images-${IMAGE_TAG}\`"
            echo "- Helm charts: \`opsengine-helm-charts-${IMAGE_TAG}\`"
            echo ""
            echo "Download from this run, then:"
            echo "\`\`\`bash"
            echo "gunzip -c keep-backend__${IMAGE_TAG}.tar.gz | docker load"
            echo "helm upgrade --install temporal-worker ./temporal-worker-*.tgz"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit Helm version bump
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/temporal-worker/Chart.yaml helm/provider-mock/Chart.yaml helm/temporal/Chart.yaml \
            helm/synthetic-checks/Chart.yaml \
            helm/temporal-worker/values-prod.yaml helm/provider-mock/values-prod.yaml \
            helm/keep-values-prod.yaml
          if git diff --cached --quiet; then
            echo "No Helm changes to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore(helm): bump charts and prod image tags [skip ci]

          Published Docker/Helm artifacts from CI; prod values now point at those tags.
          EOF
          )"
          git push
