name: Tests (E2E)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "keep/**"
      - "keep-ui/**"
      - "tests/**"
      - "docker/**"
      - ".github/workflows/test-pr-e2e.yml"
      - ".github/workflows/run-e2e-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: 3.11
  STORAGE_MANAGER_DIRECTORY: /tmp/storage-manager
  MYSQL_ROOT_PASSWORD: keep
  MYSQL_DATABASE: keep
  POSTGRES_USER: keepuser
  POSTGRES_PASSWORD: keeppassword
  POSTGRES_DB: keepdb
  EE_ENABLED: true
  COMPOSE_PROJECT_NAME: keep

jobs:
  prepare-test-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .venv
          key: pydeps-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies using poetry
        run: poetry install --no-interaction --no-root --with dev

      - name: Get Playwright version from poetry.lock
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(grep "playwright" poetry.lock -A 5 | grep "version" | head -n 1 | cut -d'"' -f2)
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright and dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            poetry run playwright install --with-deps
          else
            poetry run playwright install-deps
          fi

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build frontend image
        run: |
          docker build -f docker/Dockerfile.ui \
            --build-arg NPM_CI=0 \
            --build-arg NODE_MAX_OLD_SPACE_SIZE=4096 \
            --build-arg IGNORE_TS_ERRORS=1 \
            -t keep-frontend:ci \
            keep-ui

      - name: Save frontend image
        run: |
          mkdir -p dist/e2e
          docker save keep-frontend:ci | gzip -1 > dist/e2e/keep-frontend.tar.gz

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-keep-frontend
          path: dist/e2e/keep-frontend.tar.gz
          if-no-files-found: error
          retention-days: 3

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Precompile Alpine grpcio wheels
        run: docker build -f docker/Dockerfile.api.alpine-wheels -t keep-api-alpine-wheels:py313 .

      - name: Build backend image
        run: |
          docker build -f docker/Dockerfile.api \
            --build-arg ALPINE_WHEELS_IMAGE=keep-api-alpine-wheels:py313 \
            -t keep-backend:ci .

      - name: Save backend image
        run: |
          mkdir -p dist/e2e
          docker save keep-backend:ci | gzip -1 > dist/e2e/keep-backend.tar.gz

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-keep-backend
          path: dist/e2e/keep-backend.tar.gz
          if-no-files-found: error
          retention-days: 3

  run-mysql-with-redis:
    needs: [build-frontend, build-backend, prepare-test-environment]
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      db-type: mysql
      redis_enabled: true
      python-version: 3.11
      backend-image-name: keep-backend:ci
      frontend-image-name: keep-frontend:ci

  run-postgresql-without-redis:
    needs: [build-frontend, build-backend, prepare-test-environment]
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      db-type: postgres
      redis_enabled: false
      python-version: 3.11
      backend-image-name: keep-backend:ci
      frontend-image-name: keep-frontend:ci

  run-sqlite-without-redis:
    needs: [build-frontend, build-backend, prepare-test-environment]
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      db-type: sqlite
      redis_enabled: false
      python-version: 3.11
      backend-image-name: keep-backend:ci
      frontend-image-name: keep-frontend:ci
