# Development stack: build from local Dockerfiles and mount source for hot reload.
# Prefer: make up   (or make dev)
services:
  keep-frontend-dev:
    extends:
      file: docker-compose.common.yml
      service: keep-frontend-common
    image: keep-frontend-dev:local
    pull_policy: build
    environment:
      - AUTH_TYPE=NO_AUTH
      - API_URL=http://keep-backend-dev:8080
      - SENTRY_DISABLED=true
    build:
      context: .
      dockerfile: docker/Dockerfile.dev.ui
    volumes:
      - ./keep-ui:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - keep-backend-dev

  keep-backend-dev:
    extends:
      file: docker-compose.common.yml
      service: keep-backend-common
    image: keep-backend-dev:local
    pull_policy: build
    environment:
      - AUTH_TYPE=NO_AUTH
    build:
      context: .
      dockerfile: docker/Dockerfile.dev.api
    volumes:
      - .:/app
      - ./state:/state

  keep-websocket-server:
    extends:
      file: docker-compose.common.yml
      service: keep-websocket-server-common
