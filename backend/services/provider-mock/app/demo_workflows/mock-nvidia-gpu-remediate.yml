# End-to-end hybrid demo:
#   NVIDIA GPU mock alerts → Keep incident → Temporal RemediateNvidiaGpu
#     → cordon/drain (suite L2+) → mock dcgmi diag
#     → Pass/RESET: remediates + uncordon, resolves incident
#     → Fail/ISOLATE: mock failure email; stays cordoned; incident open
#   Suite L3+ auto-requires Keep Approvals (demo uses suite 2).
#
# Prerequisites:
#   make start   # provider-mock :8099 + Temporal worker with RemediateNvidiaGpu
#   Register Grafana + Temporal in http://localhost:8099
#   make demo-nvidia-gpu
#
# Fire:
#   Mock UI → VictoriaMetrics → "GPU: rule + temp/mem"
#   Success: cordon → diag Pass → remediation ok → uncordon; incident resolves
#   Fail:    enable Force fail, re-fire; diag ISOLATE + Failure emails; stays cordoned
workflow:
  id: mock-nvidia-gpu-remediate
  name: Mock NVIDIA GPU → Temporal remediate
  description: >
    On reserved alert code DCGM_* (alert or incident), start Temporal
    RemediateNvidiaGpu once. The worker cordons (L2+), runs mock DCGM
    diagnostics, then Pass/RESET remediates and uncordons, or Fail/ISOLATE
    emails ops and leaves the node cordoned.
  disabled: false
  triggers:
    - type: alert
      cel: has(labels.code) && labels.code.startsWith("DCGM_") && status == "firing"
    - type: incident
      events:
        - created
        - updated
      cel: code.startsWith("DCGM_") || codes.exists(c, c.startsWith("DCGM_"))
  owners: []
  services: []
  consts:
    temporal_catalog_key: remediate-nvidia-gpu
    remediation_action: reset_gpu
    # Default medium suite (memory+pcie): cordon yes, approval no.
    # Use "3" / "long" to exercise Keep Approvals + longer plugins.
    diag_suite: "2"
  actions:
    - name: start-gpu-remediation
      if: "not '{{ incident.gpu_remediation }}{{ alert.gpu_remediation }}'"
      provider:
        type: temporal
        config: "{{ providers.mock-temporal }}"
        with:
          operation: start_workflow
          workflow_type: RemediateNvidiaGpu
          task_queue: keep-ops
          workflow_id: "{{ incident.id or alert.fingerprint }}-remediate-nvidia-gpu"
          arg:
            incident_id: "{{ incident.id }}"
            alert_fingerprint: "{{ alert.fingerprint }}"
            code: "{{ alert.labels.code or incident.code }}"
            alert_code: "{{ alert.labels.code or incident.code }}"
            host: "{{ alert.labels.host or incident.gpu_host or 'gpu-node-a03' }}"
            action: "{{ consts.remediation_action }}"
            suite: "{{ consts.diag_suite }}"
            gpu_index: "{{ alert.labels.gpu or 0 }}"
            name: "{{ incident.name or alert.name }}"
            severity: "{{ incident.severity or alert.severity }}"
            status: "{{ incident.status or alert.status }}"
          enrich_incident:
            - key: gpu_remediation
              value: "started"
            - key: remediation
              value: "nvidia-gpu-remediate-started"
            - key: temporal_last_catalog_id
              value: "remediate-nvidia-gpu"
            - key: gpu_diag_suite
              value: "{{ consts.diag_suite }}"
            - key: gpu_host
              value: "{{ alert.labels.host or 'gpu-node-a03' }}"
            - key: gpu_id
              value: "{{ alert.labels.gpu_id or '' }}"
            - key: gpu_rack
              value: "{{ alert.labels.rack or '' }}"
            - key: gpu_row
              value: "{{ alert.labels.row or '' }}"

    - name: log-gpu-remediation-started
      if: "not '{{ incident.gpu_remediation }}{{ alert.gpu_remediation }}'"
      provider:
        type: console
        with:
          message: >
            Temporal RemediateNvidiaGpu (cordon → diag → remediate/isolate)
            started for incident {{ incident.id }} ({{ incident.name }}).
            Check Temporal UI http://localhost:8233 and
            provider-mock NVIDIA GPU server tab http://localhost:8099
