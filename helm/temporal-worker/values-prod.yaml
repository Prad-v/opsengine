# Prod overlay (namespace: keep-prod). CI sets tag to the published artifact.
image:
  repository: keep-temporal-worker
  tag: "sha-5b75ebb"
  pullPolicy: IfNotPresent

replicaCount: 2

temporal:
  address: temporal.keep-prod.svc.cluster.local:7233
  namespace: default
  taskQueue: keep-ops

keep:
  apiUrl: http://keep-backend.keep-prod.svc.cluster.local:8080
  apiKeySecretName: keep-api-keys
  apiKeySecretKey: KEEP_API_KEY

gpu:
  mockUrl: http://provider-mock.keep-prod.svc.cluster.local:8099
  alertEmailTo: ops@ai-dc.local

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
