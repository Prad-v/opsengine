# Prod overlay — set image repository/tag via CI.
image:
  repository: your-registry/keep-temporal-worker
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

temporal:
  address: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: default
  taskQueue: keep-ops

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
