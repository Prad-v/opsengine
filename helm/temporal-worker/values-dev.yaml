# Dev / kind overlay — in-cluster Temporal, Keep, and provider-mock.
image:
  tag: "0.1.1"
  pullPolicy: IfNotPresent

temporal:
  address: temporal:7233
  namespace: default
  taskQueue: keep-ops

keep:
  apiUrl: http://keep-backend:8080
  apiKey: keepappkey

gpu:
  mockUrl: http://provider-mock:8099
  alertEmailTo: ops@ai-dc.local

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
