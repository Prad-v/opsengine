# Prod overlay (namespace: keep-prod).
# Official keephq/keep chart + published images (Artifact Registry by default).
# CI (.github/workflows/publish-k8s-images.yml) uploads Docker/Helm GitHub
# artifacts and retargets repository/tag to those local image names.

global:
  ingress:
    enabled: true
    className: nginx

backend:
  enabled: true
  image:
    repository: keep-backend
    tag: "sha-89a585d"
    pullPolicy: IfNotPresent
  env:
    - name: DATABASE_CONNECTION_STRING
      value: mysql+pymysql://root@keep-database:3306/keep
    - name: DATABASE_NAME
      value: keep-database
    - name: SECRET_MANAGER_TYPE
      value: k8s
    - name: PORT
      value: "8080"
    - name: PUSHER_APP_ID
      value: "1"
    - name: PUSHER_APP_KEY
      value: keepappkey
    - name: PUSHER_APP_SECRET
      value: keepappsecret
    - name: PUSHER_HOST
      value: keep-websocket
    - name: PUSHER_PORT
      value: "6001"
    - name: PROMETHEUS_MULTIPROC_DIR
      value: /tmp/prometheus
    - name: AUTH_TYPE
      value: NOAUTH
    - name: KEEP_DEFAULT_API_KEYS
      value: mock-admin:admin:keepappkey
    - name: KEEP_API_URL
      value: http://keep-backend:8080
    - name: KEEP_EVENT_WORKERS
      value: "8"
    - name: KEEP_MAX_WORKFLOW_WORKERS
      value: "10"
    - name: KEEP_MAINTENANCE_WINDOWS_ENABLED
      value: "true"
    - name: MAINTENANCE_WINDOW_STRATEGY
      value: default
    - name: DATABASE_POOL_SIZE
      value: "20"
    - name: DATABASE_MAX_OVERFLOW
      value: "20"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

frontend:
  enabled: true
  image:
    repository: keep-frontend
    tag: "sha-89a585d"
    pullPolicy: IfNotPresent
  env:
    - name: NEXTAUTH_SECRET
      value: secret
    - name: VERCEL
      value: "1"
    - name: ENV
      value: production
    - name: NODE_ENV
      value: production
    - name: HOSTNAME
      value: 0.0.0.0
    - name: PUSHER_APP_KEY
      value: keepappkey
    - name: FRIGADE_DISABLED
      value: "true"
    - name: AUTH_TYPE
      value: NOAUTH
    - name: API_URL
      value: http://keep-backend:8080
    - name: API_URL_CLIENT
      value: /v2
    - name: NEXTAUTH_URL
      value: http://localhost

websocket:
  image:
    pullPolicy: IfNotPresent

database:
  pv:
    enabled: true
    size: 5Gi
  pvc:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1.5Gi
