apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal.fullname" . }}
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      serviceAccountName: {{ include "temporal.serviceAccountName" . }}
      containers:
        - name: temporal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --ui-ip
            - 0.0.0.0
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            - name: ui
              containerPort: {{ .Values.service.uiPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            exec:
              command:
                - temporal
                - operator
                - cluster
                - health
                - --address
                - 127.0.0.1:{{ .Values.service.grpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - temporal
                - operator
                - cluster
                - health
                - --address
                - 127.0.0.1:{{ .Values.service.grpcPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
