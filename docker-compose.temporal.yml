# Temporal local development server (CLI start-dev: frontend + Web UI + in-memory SQLite).
# Included automatically by: make deps / make up / make local
# Standalone:
#   docker compose -f docker-compose.temporal.yml up -d
#
# Frontend (gRPC): localhost:7233
# Web UI:          http://localhost:8233
# Namespace:       default
#
# Keep provider config (host apps): address=localhost:7233, namespace=default, tls=false
# Keep provider config (in-compose backend): address=temporal:7233
services:
  temporal:
    image: temporalio/temporal:1.4.1
    container_name: keep-temporal
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "127.0.0.1:7233",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

